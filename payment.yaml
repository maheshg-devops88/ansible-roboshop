---
 - name: Configure Payment 
   hosts: payment 
   become: true 
   tasks:
     - name: install python gcc 
       ansible.builtin.dnf: 
          name: "{{ item }}"
          state: present 
       loop: 
         - python3 
         - gcc
         - python3-devel 
         
     - name: Create roboshop user
       ansible.builtin.user:
         name: roboshop
         comment: "roboshop system user"
         system: true
         home: /app
         shell: /sbin/nologin   
    
     - name: Create app Directory
       ansible.builtin.file:
        name: /app
        state: directory

     - name: download application code
       ansible.builtin.get_url:
         url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
         dest: /tmp/payment.zip

     - name: unarchive payment.jar zip file
       ansible.builtin.unarchive:
         src: /tmp/payment.zip
         dest: /app
         remote_src: yes

     - name: Install specified python requirements
       ansible.builtin.pip:
          requirements: requirements.txt
          chdir: /app

    
     - name: Copy payment.service file to /etc/systemd/system/payment.service
       ansible.builtin.copy:
         src: /home/ec2-user/ansible-roboshop/payment.service
         dest: /etc/systemd/system/
  
     - name: systemd reload
       ansible.builtin.systemd_service:
        daemon_reload: true
    
     - name: Enable and Start payment Service
       ansible.builtin.service:
         name: payment
         state: restarted
         enabled: true