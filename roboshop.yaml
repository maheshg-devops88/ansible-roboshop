---
 - name: create ec2 instance for roboshop project
   hosts: local
   connection: local
   vars:
    image_id: ami-0220d79f3f480ecf5
    instance_type: t2.micro
    sg_id: sg-020b6d9853c171a73
    snet_id: subnet-06a0137ee419d9703
   tasks:
     - name: create ec2 instance 
       amazon.aws.ec2_instance:
         name: "{{ item }}"
         image_id: {{ image_id }}
         instance_type: {{ instance_type }}
         security_group: {{ sg_id }}
         subnet_id: {{ snet_id }}
       loop: 
         - mongodb