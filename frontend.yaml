---
- name: Configure Frontend
  hosts: frontend
  become: true
  tasks:
  - name: Enable module nginx 1.24
    ansible.builtin.command: dnf module enable nginx:1.24 -y

  - name: Install nginx 1.24
    ansible.builtin.dnf:
      name: nginx
      state: present
  
  - name: Remove default file
    ansible.builtin.file:
      path: /usr/share/nginx/html/*
      state: absent
  
  - name: Delete frontend content in tmp Directory 
    ansible.builtin.file: 
      src: /tmp/frontend.zip
      state: absent 

  - name: Download the frontend content
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
      dest: /tmp/frontend.zip

  - name: Extract the frontend content
    ansible.builtin.unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html
      remote_src: yes

  - name: Copy nginx.conf
    ansible.builtin.copy: 
       src: /home/ec2-user/ansible-roboshop/nginx.conf.j2
       dest: /etc/nginx/nginx.conf
  
  - name: Start and Enable nginx
    ansible.builtin.service:
      name: nginx
      enabled: yes
      state: started