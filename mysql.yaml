---
- name: Install mysql server
  hosts: mysql
  become: true
  tasks:
  - name: Install mysql
    ansible.builtin.dnf:
      name: mysql-server
      state: present

  - name: Enable and Start the Service
    ansible.builtin.service:
      name: mysqld
      enabled: yes
      state: restarted

  - name: Install dependencies for mysql
    ansible.builtin.pip:
      name: "{{ item }}"
    loop: 
      - PyMySQL

  - name: Update mysql password
    community.mysql.mysql_user:
      user: root
      password: RoboShop@1
