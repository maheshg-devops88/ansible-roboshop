---
- name: Configure Catalogue Service
  hosts: catalogue
  become: true
  vars:
    MONGODB_HOST: mongodb-dev.daws88s.shop
  tasks:
  - name: Enable nodejs
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: Install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: Create roboshop user
    ansible.builtin.user:
      name: roboshop
      comment: "roboshop system user"
      system: true
      home: /app
      shell: /sbin/nologin

  - name: Delete app Directory
    ansible.builtin.file:
      name: /app 
      state: absent

  - name: Create app Directory
    ansible.builtin.file:
      name: /app
      state: directory

  - name: download application code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip

  - name: unarchive catalogue zip file
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: Install npm
    community.general.npm:
      path: /app
      state: latest

  - name: copy catalogue service to /etc/systemd/system/catalogue.service
    ansible.builtin.template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service

  - name: systemd reload
    ansible.builtin.systemd_service:
      daemon_reload: true
      name: catalogue

  - name: Copy mongo.repo file to /etc/yum.repos.d/mongo.repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/

  - name: Install mongodb-mongosh
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  - name: load master data to mongodb 
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output

  - name: print the catalogue_output
    ansible.builtin.debug:
      msg: "{{ catalogue_output }}"

  - name: load the products
    ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: catalogue_output.stdout  | int < 0

  - name: Enable and Start Catalogue Service
    ansible.builtin.service:
      name: catalogue
      state: restarted
      enabled: true